server {
    listen 80;
    server_name _;

    # Drone video uploads can be large
    client_max_body_size 2G;
    proxy_read_timeout 300s;

    # ASCII PLY point clouds compress extremely well
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml application/octet-stream;

    # REST API -> FastAPI backend container
    location /api/ {
        proxy_pass http://backend:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Job artifacts (.ply point clouds, meshes, metrics) and uploaded videos
    location /jobs/ {
        proxy_pass http://backend:5173;
        proxy_set_header Host $host;
    }

    location /data/ {
        proxy_pass http://backend:5173;
        proxy_set_header Host $host;
    }

    # Compiled SPA bundle
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
